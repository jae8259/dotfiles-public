add_newline = false
# A minimal left prompt
format = """$directory$character"""
palette = "catppuccin_mocha"
# Keep server identity, VCS state, environments, and command state on the right.
right_format = """$hostname$vcs$conda$golang$rust$cpp$cmd_duration$status$jobs"""
command_timeout = 1000

[character]
vicmd_symbol = "[N] >>>"
success_symbol = '[➜](bold green)'

[username]
disabled = true

[hostname]
ssh_only = true
ssh_symbol = ''
trim_at = ''
format = '[$hostname]($style) '
style = 'bold sapphire'

[vcs]
# Prefer Jujutsu in colocated repositories; fall back to Git elsewhere.
order = ['jj', 'git']
jj_modules = '$jj_bookmark$jj_change$jj_metrics$jj_status'
git_modules = '$git_branch$git_state$git_status'

[jj_bookmark]
symbol = 'jj:'
style = 'bold mauve'

[jj_change]
change_hash_length = 7
commit_hash_length = 7

[jj_metrics]
added_style = 'bold green'
deleted_style = 'bold red'

[cmd_duration]
min_time = 0
show_milliseconds = true
format = 'took [$duration]($style) '
style = 'bold yellow'

[git_branch]
format =  '[$symbol$branch(:$remote_branch)]($style)'

[aws]
format = '[$symbol(profile: "$profile" )(\(region: $region\) )]($style)'
disabled = false
style = 'bold blue'
symbol = " "

[golang]
format = '[ ](bold cyan)'

[kubernetes]
symbol = '☸ '
disabled = true
detect_files = ['Dockerfile']
format = '[$symbol$context( \($namespace\))]($style) '

[docker_context]
disabled = true

